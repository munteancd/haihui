name: Supabase keep-alive

# Free Supabase projects are paused after a week with no traffic, and a paused project
# breaks multiplayer. This reads the rooms table twice a week so it never goes idle.
# A failed run (red X under Actions) means the project is paused or gone: see
# docs/supabase-setup.md.
on:
  schedule:
    - cron: '17 6 * * 1,4'   # Monday and Thursday, 06:17 UTC
  workflow_dispatch:         # "Run workflow" button, for a manual check

permissions:
  contents: write            # for the marker commit in the last step

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the rooms table
        run: |
          url=$(sed -n "s/.*SUPABASE_URL = '\(.*\)'.*/\1/p" src/config.js)
          key=$(sed -n "s/.*SUPABASE_ANON_KEY = '\(.*\)'.*/\1/p" src/config.js)
          curl -fsS "$url/rest/v1/rooms?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key"
          echo " <- Supabase is awake"

      # GitHub switches off scheduled workflows in a repository with no commits for 60
      # days. After 45 quiet days, a dated marker commit resets that clock.
      - name: Keep the schedule from being switched off
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%F > .github/keepalive
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/keepalive
            git commit -m "Keep the Supabase keep-alive schedule running"
            git push
          fi
